<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <title>Patients</title>
</head>

<body>

    <h1>Patient Management</h1>

    <a href="{% url 'patient_create' %}}">+ Add Patient</a>

    <hr>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Phone</th>
                <th>Email</th>
                <th>Actions</th>
            </tr>
        </thead>

        <tbody>

            {% for patient in patients %}

            <tr>
                <td>{{ patient.id }}</td>

                <td>
                    {{ patient.first_name }}
                    {{ patient.last_name }}
                </td>

                <td>{{ patient.phone }}</td>

                <td>{{ patient.email }}</td>

                <td>
                    <a href="#">View</a>
                    <a href="#">Edit</a>
                    <a href="#">Delete</a>
                </td>
            </tr>

            {% empty %}

            <tr>
                <td colspan="5">
                    No patients found.
                </td>
            </tr>

            {% endfor %}

        </tbody>
    </table>

</body>

</html>
